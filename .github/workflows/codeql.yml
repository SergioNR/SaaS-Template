name: CodeQL

on:
  push:
    branches: [ "latest", "next" ]
  pull_request:
    branches: [ "latest", "next" ]
  # Weekly run so new queries catch issues in code that has not changed
  schedule:
    - cron: '27 4 * * 1'

concurrency:
  group: codeql-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

# Least privilege - the analysis reads workflow runs for status reporting and
# uploads SARIF results
permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  analyze:
    name: Analyze (javascript-typescript)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Backend and frontend are both JavaScript - one language covers the
      # monorepo and no build step is needed for analysis
      - name: Initialize CodeQL
        uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          languages: javascript-typescript

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          category: /language:javascript-typescript
